name: Actualizar datos

# Calendario aproximado de publicación del DANE:
#   IPC: primeros días del mes.   ISE: hacia la mitad del mes (con dos meses de rezago).
#   Mercado laboral: final del mes siguiente.   Comercio exterior: unos 45-50 días después del mes.   TRM y tasas: diarias.   Presupuesto: mensual (MinHacienda).
# Corre todos los días a las 10:00 a. m. hora Colombia (15:00 UTC); el mercado laboral sale a fin de mes.
# Si no hay datos nuevos, no guarda nada. También se puede correr a mano desde "Actions".
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Cada indicador corre aunque otro falle, para no perder lo que sí se actualizó.
      - name: IPC (DANE)
        if: always()
        run: python scripts/ipc.py

      - name: ISE (DANE)
        if: always()
        run: python scripts/ise.py

      - name: Mercado laboral (DANE)
        if: always()
        run: python scripts/empleo.py

      - name: Tasas y dólar
        if: always()
        run: python scripts/tasas.py

      - name: Comercio exterior (DANE)
        if: always()
        run: python scripts/comercio.py

      - name: Presupuesto General de la Nación
        if: always()
        run: python scripts/presupuesto.py

      # Lee los archivos históricos de Hacienda guardados en fuentes/minhacienda/ (se actualizan a mano)
      - name: Presupuesto histórico por sector
        if: always()
        run: python scripts/presupuesto_historico.py

      - name: Datos para la página web
        if: always()
        run: python scripts/web.py

      - name: Guardar cambios si hay datos nuevos
        if: always()
        run: |
          git config user.name "actualizador-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add datos/ web/
          if git diff --cached --quiet; then
            echo "Sin datos nuevos."
          else
            git commit -m "Actualización automática de datos $(date -u +%Y-%m-%d)"
            git push
          fi
