name: Actualizar datos

# Calendario aproximado de publicación del DANE:
#   IPC: primeros días del mes.   ISE: hacia la mitad del mes (con dos meses de rezago).
# Corre todos los días del 4 al 25 a las 10:00 a. m. hora Colombia (15:00 UTC).
# Si no hay datos nuevos, no guarda nada. También se puede correr a mano desde "Actions".
on:
  schedule:
    - cron: "0 15 4-25 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # Cada indicador corre aunque otro falle, para no perder lo que sí se actualizó.
      - name: IPC (DANE)
        if: always()
        run: python scripts/ipc.py

      - name: ISE (DANE)
        if: always()
        run: python scripts/ise.py

      - name: Guardar cambios si hay datos nuevos
        if: always()
        run: |
          git config user.name "actualizador-automatico"
          git config user.email "actions@users.noreply.github.com"
          git add datos/
          if git diff --cached --quiet; then
            echo "Sin datos nuevos."
          else
            git commit -m "Actualización automática de datos $(date -u +%Y-%m-%d)"
            git push
          fi
